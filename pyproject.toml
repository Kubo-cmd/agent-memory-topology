[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-topology"
version = "0.1.0"
description = "Semantic memory compression via persistent homology for AI agents"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "LYTA.EXE", email = "lyta@kubo100x.dev"}
]
maintainers = [
    {name = "Kubo100x", email = "Kubo100x@proton.me"}
]
keywords = [
    "ai",
    "agent",
    "memory",
    "topology",
    "tda",
    "persistent-homology",
    "compression",
    "embedding",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "ripser>=0.6.0",
    "scikit-tda>=1.0.0",
    "persim>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
viz = [
    "matplotlib>=3.5.0",
    "plotly>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/Kubo-cmd/agent-memory-topology"
Repository = "https://github.com/Kubo-cmd/agent-memory-topology"
Issues = "https://github.com/Kubo-cmd/agent-memory-topology/issues"

[project.scripts]
amt-demo = "agent_memory_topology:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_memory_topology*"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
